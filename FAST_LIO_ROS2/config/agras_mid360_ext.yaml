/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: true         # 自同步: 自动计算 LiDAR/IMU 时间偏移
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR (MID360=1)
            scan_line:  4
            blind: 0.3
            timestamp_unit: 3            # 3=US (MID360 点时间戳单位微秒)
            scan_rate: 10                # ★ LiDAR 10Hz, 匹配 publish_freq (10Hz)
                                        #   IMU 500Hz → 每扫描约50帧IMU数据

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.001           # 提高以更快收敛陀螺偏置 (外置IMU需重新估计)
            fov_degree:    360.0
            det_range:     50.0
            extrinsic_est_en:  false     # LI-Init 已标定, 关闭在线估计
            extrinsic_T: [ 0.089299, -0.069902, 0.213543 ]
            extrinsic_R: [ 0.054884, 0.998303, -0.019466,
                           0.995874, -0.056140, -0.071290,
                           0.072262, 0.015473, 0.997266 ]      


        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: false
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.