/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: true         # 自同步: 自动计算 LiDAR/IMU 时间偏移
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR (MID360=1)
            scan_line:  4
            blind: 0.3
            timestamp_unit: 3            # 3=US (MID360 点时间戳单位微秒)
            scan_rate: 10                # ★ LiDAR 10Hz, 匹配 publish_freq (10Hz)
                                        #   IMU 500Hz → 每扫描约50帧IMU数据

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     50.0
            extrinsic_est_en:  false
            extrinsic_T: [ 0.089, 0.01, -0.21 ]
            extrinsic_R: [ 1., 0., 0.,
                        0., 1., 0.,
                        0., 0., 1.] 


        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1