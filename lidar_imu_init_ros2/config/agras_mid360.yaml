/**:
  ros__parameters:
    common:
        lid_topic:  "/livox/lidar"
        imu_topic:  "/livox/imu"

    preprocess:
        lidar_type: 1                # Livox series LiDAR
        feature_extract_en: false
        scan_line: 4                 # ★ MID360 标准 4 线 (原误设 6, 会导致线号解算错位)
        blind: 0.5                   # 与标准 mid360.yaml 一致

    initialization:
        cut_frame_num: 5            # must be positive integer
        orig_odom_freq: 10          # ★ MID360 标准扫描率 10Hz (与驱动 publish_freq/FAST-LIO scan_rate 一致;
                                    #   之前误设 33 导致互相关时间换算错误, Time Lag 标出 -0.8s 级荒谬值)
        mean_acc_norm: 9.81         # 外置/内置 IMU 均输出 m/s² (g 单位时填 1.0)
        online_refine_time: 0.0      # ★ 0=跳过在线精化 (内置 IMU 噪声大, 精化阶段 EKF 易发散:
                                     #   实测 gyro bias 飙到 0.9 rad/s 级荒谬值; 直接采用 Initialization 结果)
        data_accum_length: 500.0
        Rot_LI_cov: [ 0.00005, 0.00005, 0.00005 ]
        Trans_LI_cov: [ 0.00001, 0.00001, 0.00001 ]

    mapping:
        filter_size_surf: 0.05
        filter_size_map: 0.15
        gyr_cov: 2.0
        acc_cov: 2.0
        b_acc_cov: 0.0001
        b_gyr_cov: 0.0001
        det_range: 100.0

    publish:
        path_en:  true
        scan_publish_en:  true
        dense_publish_en: true
        scan_bodyframe_pub_en: false

    pcd_save:
        pcd_save_en: false
        interval: -1
