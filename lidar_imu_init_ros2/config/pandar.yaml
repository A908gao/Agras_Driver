/**:
  ros__parameters:
    common:
        lid_topic:  "/hesai/pandar"
        imu_topic:  "/imu"

    preprocess:
        lidar_type: 5
        scan_line: 32
        blind: 3.0
        feature_extract_en: false

    initialization:
        cut_frame_num: 3
        orig_odom_freq: 10
        mean_acc_norm: 9.805
        online_refine_time: 15.0
        data_accum_length: 300.0
        Rot_LI_cov: [ 0.00005, 0.00005, 0.00005 ]
        Trans_LI_cov: [ 0.00001, 0.00001, 0.00000001 ]

    mapping:
        filter_size_surf: 0.1
        filter_size_map: 0.1
        gyr_cov: 20.0
        acc_cov: 2.0
        b_acc_cov: 0.0001
        b_gyr_cov: 0.0001
        det_range: 120.0

    publish:
        path_en:  true
        scan_publish_en:  true
        dense_publish_en: true
        scan_bodyframe_pub_en: true

    pcd_save:
        pcd_save_en: false
        interval: -1
