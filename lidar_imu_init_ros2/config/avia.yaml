/**:
  ros__parameters:
    common:
        lid_topic:  "/livox/lidar"
        imu_topic:  "/wit/imu"

    preprocess:
        lidar_type: 1
        feature_extract_en: false
        scan_line: 6
        blind: 2.0

    initialization:
        cut_frame_num: 5
        orig_odom_freq: 10
        mean_acc_norm: 9.805
        online_refine_time: 20.0
        data_accum_length: 400.0
        Rot_LI_cov: [ 0.00005, 0.00005, 0.00005 ]
        Trans_LI_cov: [ 0.00001, 0.00001, 0.00001 ]

    mapping:
        filter_size_surf: 0.05
        filter_size_map: 0.15
        gyr_cov: 50.0
        acc_cov: 2.0
        b_acc_cov: 0.0001
        b_gyr_cov: 0.0001
        det_range: 450.0

    publish:
        path_en:  true
        scan_publish_en:  true
        dense_publish_en: true
        scan_bodyframe_pub_en: true

    pcd_save:
        pcd_save_en: false
        interval: -1
